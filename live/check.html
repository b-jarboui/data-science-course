<!doctype html><html><head><meta charset="utf-8"><title>live check</title>
<style>html,body{margin:0;height:100%;background:#0b1020;overflow:hidden}#view{position:fixed;inset:0;display:grid;place-items:center}#stage{position:relative}</style></head>
<body><div id="view"><div id="stage"></div></div><div id="cap" hidden></div>
<input id="bar" type="range" hidden><span id="time" hidden></span><button id="play" hidden></button><button id="back" hidden></button><button id="fwd" hidden></button>
<script type="module">
// Automatic check: jump to ~12 moments, save each frame + errors via the local server (serve.py /__save).
const q = new URLSearchParams(location.search), id = q.get('s'), tag = q.get('tag') || 'L';
const errors = [], warns = [];
addEventListener('error', e => errors.push(String(e.message)));
addEventListener('unhandledrejection', e => errors.push(String(e.reason && e.reason.message || e.reason)));
const origErr = console.error; console.error = (...a) => { errors.push(a.map(String).join(' ')); origErr(...a); };
const save = (name, body, type) => fetch(`/__save?f=lessons/${id}/livecheck/${name}`, { method: 'POST', headers: { 'Content-Type': type }, body });
try {
  const DATA = (await import(`../data.js?v=${Date.now()}`)).default, D = DATA[id];
  const { startLesson } = await import('./engine.js');
  const lessonFn = (await import(`./${id}.js?v=${Date.now()}`)).default;
  const $ = x => document.getElementById(x);
  const ctl = await startLesson({ D, lessonFn, mount: $('stage'), audioUrl: `../audio/${id}.mp3`,
    els: { cap: $('cap'), bar: $('bar'), time: $('time'), play: $('play'), back: $('back'), fwd: $('fwd') } });
  const n = Math.min(12, D.timing.length), picks = [];
  for (let k = 0; k < n; k++) picks.push(D.timing[Math.round(k * (D.timing.length - 1) / (n - 1))][1] - 0.15);
// ?beats=34,38 : check the END of these sentences instead (for pictures that fall between the 12 default moments)
if (q.get('beats')) { picks.length = 0; for (const b of q.get('beats').split(',')) picks.push(D.timing[Math.min(+b, D.timing.length - 1)][1] - 0.15); }
  for (let k = 0; k < picks.length; k++) {
    await ctl.seek(picks[k]);
    const t0 = performance.now();
    await new Promise(r => setTimeout(r, 300));
    while (ctl.catching() && performance.now() - t0 < 30000) await new Promise(r => setTimeout(r, 100));
    await new Promise(r => setTimeout(r, 1200));
    ctl.sc.render();
    // overlap detector: two visible texts whose boxes overlap by > 30% of the smaller one = layout fault
    try {
      const M = await import('https://cdn.jsdelivr.net/npm/manim-web@0.42.0/dist/manim-web.browser.js');
      const texts = [];
      for (const m of ctl.sc.mobjects) for (const n of (m.getFamily ? m.getFamily() : [m])) {
        if (!(n instanceof M.Text)) continue;
        const op = n.opacity ?? n._opacity ?? n.fillOpacity ?? 1;
        if (op < 0.35) continue;
        const c = n.getCenter(), w = n.getWidth();
        const len0 = Math.max(1, (n.text ?? n._text ?? '').toString().length);
        const h = Math.min(n.getHeight(), 1.7 * w / len0);   // reported text height includes padding: estimate from letter width
        if (!(w > 0.05 && h > 0.05)) continue;
        const full = (n.text ?? n._text ?? '').toString();
        if (full === D.kicker || full === (D.short || D.title) || full === D.title) continue; // engine header: always placed right
        texts.push({ s: full.slice(0, 24), x0: c[0] - w / 2, x1: c[0] + w / 2, y0: c[1] - h / 2, y1: c[1] + h / 2, a: w * h });
      }
      for (let i = 0; i < texts.length; i++) for (let j = i + 1; j < texts.length; j++) {
        const A = texts[i], B = texts[j];
        const ix = Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0), iy = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0);
        if (ix <= 0 || iy <= 0) continue;
        if (A.s === B.s && Math.abs(A.x0 - B.x0) < 0.05 && Math.abs(A.y0 - B.y0) < 0.05) continue; // same text drawn twice
        if (ix * iy > 0.3 * Math.min(A.a, B.a)) warns.push(`OVERLAP at ${picks[k].toFixed(1)}s (sentence ${D.timing.findIndex(x => x[1] >= picks[k])}): "${A.s}" vs "${B.s}"`);
      }
    } catch (e) { errors.push('overlap-check failed: ' + e.message); }
    const url = ctl.sc.getCanvas().toDataURL('image/png');
    await save(`${tag}_${String(k).padStart(2, '0')}.png`, await (await fetch(url)).blob(), 'image/png');
  }
  ctl.pause();
} catch (e) { errors.push('FATAL ' + (e && e.stack || e)); }
await save(`${tag}_errors.json`, JSON.stringify(errors), 'application/json');
await save(`${tag}_warnings.json`, JSON.stringify(warns), 'application/json');
await save(`${tag}_DONE`, 'done', 'text/plain');
</script></body></html>
