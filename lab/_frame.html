<script>
const q = new URLSearchParams(location.search), f = document.createElement('iframe');
f.src = q.get('u'); f.style.cssText = `width:${q.get('w') || 375}px;height:${q.get('h') || 812}px;border:0;display:block`;

const pre = document.createElement('pre'); pre.id = 'autotest'; document.body.append(pre);

</script>
